name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,analysis]'
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m pyflakes raretrap scripts/run_paper_ablation.py scripts/check_public_release.py scripts/export_public_release.py scripts/verify_public_archive.py scripts/check_readme.py
      - run: python scripts/check_readme.py
      - run: python scripts/check_public_release.py --history
      - run: python -m build
      - name: Verify source-only publication archive
        run: |
          python -m scripts.export_public_release --output ../raretrap-source.tar.gz
          python -m scripts.verify_public_archive ../raretrap-source.tar.gz
      - name: Test unpacked reviewer source without Git
        run: |
          REVIEW_DIR=$(mktemp -d)
          tar -xzf ../raretrap-source.tar.gz -C "$REVIEW_DIR"
          cd "$REVIEW_DIR/raretrap"
          python scripts/check_public_release.py
          python -m pytest -q
      - name: Smoke-test installed wheel outside the checkout
        run: |
          python -m pip install --no-deps --force-reinstall dist/raretrap-*.whl
          PACKAGE_CHECK=$(mktemp -d)
          cd "$PACKAGE_CHECK"
          raretrap --help
          raretrap-ablation --model deepseek8b --output outputs/ablation --dry-run
